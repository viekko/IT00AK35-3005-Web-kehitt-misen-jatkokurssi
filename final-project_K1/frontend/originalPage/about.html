                    <h3>Kehax Oy:n tarina</h3>
                    <p>Kehax Oy on kotimainen perheyritys, joka on erikoistunut mattojen ja sisustustuotteiden maahantuontiin ja myyntiin. Yritys on perustettu muutama vuosi sitten, mutta sen taustalla on yrittäjän kymmenien vuosien kokemus alalta sekä vahva ammattitaito. Kehaxista on nopeasti kasvanut luotettava kumppani jälleenmyyjille ympäri Suomen. Yrityksen toiminnan ytimessä on laadukkaiden, ajattomien ja suomalaiseen makuun sopivien sisustustuotteiden tarjoaminen.</p>
                    <p>Edustamme huolella valittuja, arvostettuja pohjoismaisia brändejä, kuten Polytuft, Malla, Horredsmattan ja Mogihome. Valikoimamme yhdistää kestävät materiaalit, käytännöllisyyden ja skandinaavisen muotoilun, jotka vastaavat sekä jälleenmyyjien että loppuasiakkaiden tarpeisiin. Palvelemme sekä jälleenmyyjiämme, että tarjoamme joustavia ja asiantuntevia ratkaisuja erilaisiin projektimyynnin kohteisiin.</p>
                    <p>Toimintamme perustuu luottamukseen, laatuun ja pitkäaikaisiin kumppanuuksiin. Perheyritäjyyden arvot näkyvät henkilökohtaisessa palvelussa, sitoutumisessa asiakkaisiin ja jatkuvassa halussa kehittää valikoimaa muuttuvien sisustustrendien mukana.</p>
